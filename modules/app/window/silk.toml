[package]
name = "ui-app-window"
description = "Runs a ui-app application in a native window"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "background", "images", "commands", "program"]

[dependencies]
ui_app = { path = "..", package = "ui-app" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
ui_app_inspect = { path = "../inspect", package = "ui-app-inspect" }
ui_devtools = { path = "../../inspect/devtools", package = "ui-inspect-devtools" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "e32f076c9ac3c34aa7f65772c151919166a86770", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "71bd41ea83e25289585571df55d2bc9944d4a43c", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "786d0cbb9e359eae2cad2523c9e093cf72021ec9", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "786d0cbb9e359eae2cad2523c9e093cf72021ec9", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }

codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/codec", package = "graphics-codec" }
