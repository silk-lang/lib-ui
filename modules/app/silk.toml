[package]
name = "ui-app"
description = "An Elm-style UI framework on ui-tree: model, messages, view, update, commands"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "equal", "heap", "ui", "document", "css", "keys", "diff", "app", "backend", "program", "shell", "show", "journal", "runtime", "harness", "seq", "tasks", "virtual_list", "windows"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
