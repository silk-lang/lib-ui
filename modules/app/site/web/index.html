<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>silk-ui</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
      }
      #app {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "./silk-ui-dom.js";

      window.page = await mount({
        wasm: "./site.wasm",
        root: document.getElementById("app"),
        fonts: {
          1: 'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif',
          2: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace',
        },
        // The `Browser` service of the program, as `main.silk` imports it.
        imports: {
          site: {
            random: (sides) => 1 + Math.floor(Math.random() * sides),
            savedTheme: () => ({ light: 1, dark: 2 })[localStorage.getItem("silk-ui-theme")] ?? 0,
            saveTheme: (theme) => localStorage.setItem("silk-ui-theme", theme === 1 ? "light" : "dark"),
          },
        },
      });
    </script>
  </body>
</html>
