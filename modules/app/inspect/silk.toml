[package]
name = "ui-app-inspect"
description = "The silk-ui inspector extension: a program's messages, its model after each, and the Program panel"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "program", "extension"]

[dependencies]
ui_app = { path = "..", package = "ui-app" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_protocol = { path = "../../protocol", package = "ui-protocol" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
