# The starter page in Tauri: the same window as the ui-js demo loading the web build,
# ../dist-web (npm run build:web first). Build: cargo build --release (on Linux it needs
# the WebKitGTK 4.1 development packages).
[package]
name = "react-counter-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[workspace]
