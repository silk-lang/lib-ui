# Tauri shell for the benchmark app: one 400x300 window loading dist/web.
# Build: cargo build --release (needs the WebKitGTK 4.1 development packages on Linux).
[package]
name = "bench-counter-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[workspace]
