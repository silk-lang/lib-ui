[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "2993add8a00861396bf25af4b3cbb0f7d5a805cc", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "adbdc706a2ee152f73885f30c0096d615476f070", path = "modules/engine", package = "silkjs" }
