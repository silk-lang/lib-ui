[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa7e66f37772f5561c44fa5a456780e9021c7937", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "9eff7fde3fa232dbe16916c24667914464441774", path = "modules/engine", package = "silkjs" }
