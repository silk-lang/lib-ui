[package]
name = "ui-js"
description = "Runs a JavaScript application on a UI tree with the SilkJS engine embedded: nodes through ui-protocol batches, events delivered synchronously"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "host", "bridge"]

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "aaa6449e13bd792a83c4fe0b924758d755007389", path = "modules/style", package = "css-style" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "fae5b1b93c5823d1e1fc0dd1dc22d0366675b453", path = "modules/engine", package = "silkjs" }
