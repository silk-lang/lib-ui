[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silk/ui and __ui"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "6a283845048e1f16b825704f7639b599c3df9746", path = "modules/engine", package = "silkjs" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "6a283845048e1f16b825704f7639b599c3df9746", path = "modules/runtime", package = "silkjsruntime" }
