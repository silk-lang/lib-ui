[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "library"
exports = ["lib"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "9eff7fde3fa232dbe16916c24667914464441774", path = "modules/engine", package = "silkjs" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/platform/window", package = "platform-window" }
