[package]
name = "ui-js-window-dev"
description = "Development tools for a ui-js window: reload on a new build, and run the application from the @silk/vite development server with hot module replacement"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["lib"]

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_window = { path = "..", package = "ui-js-window" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "661f1267aca777f57b59e6b645ca713bf6e47d41", path = "modules/engine", package = "silkjs" }
