[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "bd1e7d155b1f436af7a3c0567c8a499083421e32", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "bd1e7d155b1f436af7a3c0567c8a499083421e32", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "bacc6b323425e6ed22f430579f34eb734ef8927d", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/faces", package = "font-faces" }
