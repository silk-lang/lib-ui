[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "input", "record", "request", "id", "event", "mutation", "batch", "css", "grid", "options"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a284b3a9bf9385a29cdc3646b915388d7435da7d", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "a284b3a9bf9385a29cdc3646b915388d7435da7d", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/codec", package = "graphics-codec" }
