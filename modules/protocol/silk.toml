[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "input", "record", "request", "id", "event", "mutation", "aria", "batch", "css", "grid", "options", "root"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "fd22d66796ec889289885d26ec86b8618e976d33", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "fd22d66796ec889289885d26ec86b8618e976d33", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "7e3770cb41beaf709272548863f5b020f476765f", path = "modules/codec", package = "graphics-codec" }
