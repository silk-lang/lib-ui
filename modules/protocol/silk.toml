[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "input", "record", "request", "id", "event", "mutation", "batch", "css", "grid", "options", "root"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "75300da76daa7a641c755f6f0af87ff34607cf67", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "75300da76daa7a641c755f6f0af87ff34607cf67", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/codec", package = "graphics-codec" }
