[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "library"
exports = ["lib", "input", "record", "request", "id", "event", "mutation", "batch", "css", "grid", "options", "root"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa7e66f37772f5561c44fa5a456780e9021c7937", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa7e66f37772f5561c44fa5a456780e9021c7937", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "31b30b3ea10ef42091b19cc62dafd4078a7ab6aa", path = "modules/codec", package = "graphics-codec" }
