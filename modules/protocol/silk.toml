[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "input", "record", "request", "id", "event", "mutation", "batch", "css", "grid", "options", "root"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "a206e7ecd2a30afc8002a5698ab6fd02d213d0bd", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "a206e7ecd2a30afc8002a5698ab6fd02d213d0bd", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/codec", package = "graphics-codec" }
