properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "337562411519391a2990ca37d7b0843d41966834", path = "modules/properties", package = "css-properties" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "816162323e5a08dc4fc7967801ad075b5a305911", path = "modules/codec", package = "graphics-codec" }
