[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["lib", "fonts", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "75300da76daa7a641c755f6f0af87ff34607cf67", path = "modules/layout", package = "css-layout" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/collection", package = "font-collection" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/types", package = "font-types" }
raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/raster", package = "font-raster" }
