[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "library"
exports = ["lib", "fonts", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "3b1209e9800972e794c3055ca3eff65726361f34", path = "modules/layout", package = "css-layout" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ef787b9674fc71b7219213b5eea45fd549d6a179", path = "modules/collection", package = "font-collection" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ef787b9674fc71b7219213b5eea45fd549d6a179", path = "modules/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ef787b9674fc71b7219213b5eea45fd549d6a179", path = "modules/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ef787b9674fc71b7219213b5eea45fd549d6a179", path = "modules/types", package = "font-types" }
raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ef787b9674fc71b7219213b5eea45fd549d6a179", path = "modules/raster", package = "font-raster" }
