[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
license = "MIT"

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_app = { path = "../app", package = "ui-app" }
ui_fixtures = { path = "../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "a75b3044c22ea756158e4d5e12838f19a6554b3a", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "b819e0ef64c34b0364a105253f8d1deac17244c8", path = "modules/layout", package = "css-layout" }
