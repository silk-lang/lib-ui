[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
license = "MIT"

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_app = { path = "../app", package = "ui-app" }
ui_fixtures = { path = "../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "59d9dd10ffc6a93e596073948475924e42087149", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "7db3871c7ad416e205c6db56780aa0a7c444a5a2", path = "modules/layout", package = "css-layout" }
