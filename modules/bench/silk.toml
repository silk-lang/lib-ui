[package]
name = "ui-bench"
description = "Benchmarks of the retained tree and the framework: tile walls, inherited styles, text, layout, invalidation, input and view diffing"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
license = "MIT"

[dependencies]
ui_tree = { path = "../tree", package = "ui-tree" }
ui_app = { path = "../app", package = "ui-app" }
ui_fixtures = { path = "../tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "42edcde61d4bc4915997ab013a3cc7fe3ad7118f", path = "modules/collection", package = "font-collection" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "fd22d66796ec889289885d26ec86b8618e976d33", path = "modules/layout", package = "css-layout" }
