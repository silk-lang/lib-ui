[package]
name = "ui-ghostty-web"
description = "The terminal component in a browser page: libghostty-vt in WebAssembly on the DOM host, with a small built-in shell"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "executable"

[dependencies]
ui_ghostty = { path = "..", package = "ui-ghostty" }
ghostty_vt = { path = "../vt", package = "ghostty-vt" }
ui_app = { path = "../../app", package = "ui-app" }
ui_app_dom = { path = "../../app/dom", package = "ui-app-dom" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_fixtures = { path = "../../tree/fixtures", package = "ui-tree-fixtures" }
