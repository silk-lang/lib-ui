[package]
name = "ui-ghostty-demo"
description = "A simple terminal app: a shell on a PTY, drawn by ui-ghostty in a native window"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "executable"

[dependencies]
ui_ghostty = { path = "..", package = "ui-ghostty" }
ghostty_vt = { path = "../vt", package = "ghostty-vt" }
ui_app = { path = "../../app", package = "ui-app" }
ui_app_window = { path = "../../app/window", package = "ui-app-window" }

[native]
sources = [
  { c = "native/pty_unix.c", flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"], os = ["macos", "linux"] },
  { c = "native/pty_windows.c", flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"], os = "windows" },
]
link = [{ library = "util", mode = "dynamic", os = "linux" }]
