[package]
name = "ui-ghostty"
description = "A terminal component for ui-app programs, rendered on the UI tree from libghostty-vt snapshots: cells, cursor, selection, scrollback, keys, paste, mouse reporting"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["view"]

[dependencies]
ghostty_vt = { path = "vt", package = "ghostty-vt" }
ui_app = { path = "../app", package = "ui-app" }
