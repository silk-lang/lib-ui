[package]
name = "ghostty-vt"
description = "Terminal emulation through libghostty-vt: owned terminals, input and mouse encoding, selection, styled snapshots and text export"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["terminal"]

# Run `python3 modules/ghostty/vt/scripts/prepare` once per checkout first: it puts the
# headers and the static library in native/build/ (see the README).
[native]
sources = [
  { c = ["native/bridge.c", "native/input.c"], flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-Werror"] },
]
link = [
  { static-archive = "native/build/lib/libghostty-vt.a", os = ["macos", "linux"] },
  { static-archive = "native/build/lib/ghostty-vt-static.lib", os = "windows" },
  { library = "m", mode = "dynamic", os = "linux" },
  { library = "pthread", mode = "dynamic", os = "linux" },
]

