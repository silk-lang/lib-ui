[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["lib", "legacy", "engine", "mutation", "css", "style", "resources", "provider", "node", "paint", "tree", "id", "event", "error", "inspect", "batch", "grid", "canvas_text", "input", "interact", "scrollbar", "edit", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view"]

[dependencies]
ui_protocol = { path = "../protocol", package = "ui-protocol" }
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa4b9eb1500bf6dac765a0e6a195de61223247d3", path = "modules/layout", package = "css-layout" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa4b9eb1500bf6dac765a0e6a195de61223247d3", path = "modules/properties", package = "css-properties" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "34f12056f7009c29bb55cdec7eef98973e17cf9d", path = "modules/collection", package = "font-collection" }
font_raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "34f12056f7009c29bb55cdec7eef98973e17cf9d", path = "modules/raster", package = "font-raster" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2898aab275ba5f0363ec218036f2f1045b36c18b", path = "modules/atlas", package = "graphics-atlas" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2898aab275ba5f0363ec218036f2f1045b36c18b", path = "modules/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2898aab275ba5f0363ec218036f2f1045b36c18b", path = "modules/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "2898aab275ba5f0363ec218036f2f1045b36c18b", path = "modules/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "37bd55221d1a42a4c51d50b44855be7fddb8e0b1", path = "modules/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "37bd55221d1a42a4c51d50b44855be7fddb8e0b1", path = "modules", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "fa4b9eb1500bf6dac765a0e6a195de61223247d3", path = "modules/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "34f12056f7009c29bb55cdec7eef98973e17cf9d", path = "modules/faces", package = "font-faces" }
