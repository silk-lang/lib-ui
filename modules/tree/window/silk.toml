[package]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "background", "images", "loader", "sheets", "remote", "render_thread", "render_inline", "platform_thread", "console", "clock", "browser", "companion"]

[dependencies]
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c42771fa520c4515abaadad1695e1a35e94363ce", path = "modules/web", package = "font-web" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "550690a38491a9aeaf1d69ffb54e3921c0ce7115", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "7166a093a36a64be92125f428ed8db5daf211b5b", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "f3be99fcbf6f062c797a6af6b08999501fd3effd", path = "modules/codec", package = "graphics-codec" }
