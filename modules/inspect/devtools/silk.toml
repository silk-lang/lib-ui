[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded"]

[dependencies]
ui_app = { path = "../../app", package = "ui-app" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_inspect = { path = "..", package = "ui-inspect" }
ui_inspect_server = { path = "../server", package = "ui-inspect-server" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "2993add8a00861396bf25af4b3cbb0f7d5a805cc", path = "modules/properties", package = "css-properties" }
