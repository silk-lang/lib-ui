[package]
name = "accesskit-windows"
description = "AccessKit's Windows adapter in Silk: UI Automation providers kept in step with the tree"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
license = "MIT OR Apache-2.0"
exports = ["lib", "controls", "node", "record", "events", "adapter", "sys"]

[dependencies]
accesskit = { path = "..", package = "accesskit" }
accesskit_consumer = { path = "../consumer", package = "accesskit-consumer" }

# The UI Automation side: COM providers built from the records the Silk side sends, and the
# window subclass that answers WM_GETOBJECT with them. It declares the few Windows types it
# needs itself, since no SDK headers reach clang. Other platforms compile nothing here.
[native]
sources = [
  { c = "native/uia.c", flags = ["-O2", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-ffreestanding", "-fno-builtin", "-fno-stack-protector"], os = "windows" },
]
link = [
  { library = "uiautomationcore", mode = "dynamic", os = "windows" },
  { library = "oleaut32", mode = "dynamic", os = "windows" },
  { library = "user32", mode = "dynamic", os = "windows" },
]
