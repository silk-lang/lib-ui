[package]
name = "accesskit-macos"
description = "AccessKit's macOS adapter in Silk: NSAccessibility elements kept in step with the tree"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
license = "MIT OR Apache-2.0"
exports = ["lib", "roles", "node", "record", "events", "adapter", "sys"]

[dependencies]
accesskit = { path = "..", package = "accesskit" }
accesskit_consumer = { path = "../consumer", package = "accesskit-consumer" }

# The AppKit side: NSAccessibilityElement objects built from the records the Silk side sends,
# and the view subclass that exposes them. Other platforms compile nothing here.
[native]
sources = [
  { objc = "native/adapter.m", flags = ["-fobjc-arc", "-fblocks", "-O2", "-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-deprecated-declarations", "-Wno-deprecated-implementations", "-mmacosx-version-min=11.0"], os = "macos" },
]
link = [
  { framework = "Cocoa", os = "macos" },
]
