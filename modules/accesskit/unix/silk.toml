[package]
name = "accesskit-unix"
description = "AccessKit's Linux adapter in Silk: AT-SPI over D-Bus"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
license = "MIT OR Apache-2.0"
exports = ["lib", "atspi", "node", "events", "text", "server", "adapter"]

[dependencies]
accesskit = { path = "..", package = "accesskit" }
accesskit_consumer = { path = "../consumer", package = "accesskit-consumer" }
dbus = { path = "../../dbus", package = "dbus" }
