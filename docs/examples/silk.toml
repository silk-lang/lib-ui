[package]
name = "ui-docs-examples"
description = "Every example program the Silk UI docs show, compiled and tested"
version = "0.1.0"
silk-version = "0.1.0-dev.72+9c780a04d6ef"
kind = "library"
exports = ["lib", "core.counter", "core.look", "core.menu", "core.todo", "core.dice", "core.stopwatch", "core.pages", "core.order", "core.plans", "core.album", "showcase.board", "focus.look", "focus.step1", "focus.step2", "focus.step3", "focus.step4", "tree.picture", "tree.card", "tree.clicker", "tree.field", "tree.remote", "native.pad", "native.swatches", "native.search"]

[dependencies]
ui_app = { path = "../../modules/app", package = "ui-app" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27a7df29ac7dec7e2c343ea3845a720e74d6db05", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "27a7df29ac7dec7e2c343ea3845a720e74d6db05", path = "modules/vector", package = "graphics-vector" }
