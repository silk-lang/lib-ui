[package]
name = "tree-window"
description = "A UI tree in a native window, with no framework"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "executable"

[dependencies]
ui_tree = { path = "../../../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_inspect_server = { path = "../../../../modules/inspect/server", package = "ui-inspect-server" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "249b43d8b7c18421795fa213b5550a9db7b2dce3", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "71bd41ea83e25289585571df55d2bc9944d4a43c", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/vector", package = "graphics-vector" }
