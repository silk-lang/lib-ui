<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dice</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "./silk-ui-dom.js";

      await mount({
        wasm: "./dice.wasm",
        root: document.getElementById("app"),
        // The functions the program imports: `app#random` in src/main.silk.
        imports: { app: { random: () => Math.random() } },
      });
    </script>
  </body>
</html>
