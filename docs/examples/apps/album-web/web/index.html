<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Album</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "./silk-ui-dom.js";

      // The album names its photos, icons and fonts by URL ("photos/dusk.png",
      // "fonts/Geist.ttf"), so the page loads them from beside itself.
      await mount({
        wasm: "./album.wasm",
        root: document.getElementById("app"),
      });
    </script>
  </body>
</html>
