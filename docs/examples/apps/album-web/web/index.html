<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Album</title>
    <style>
      /* The two fonts the album ships. Geist is a variable font: one file, weights 100 to 900. */
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/Geist.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/GeistMono.ttf") format("truetype");
        font-weight: 100 900;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "./silk-ui-dom.js";

      // The numbers are the album's: PHOTO + i, HEART and SEARCH, DISPLAY and LABEL.
      const photos = [
        "dusk.png", "meadow.jpg", "moonrise.png", "ember.jpg", "snowline.png", "canyon.jpg",
        "night-walk.png", "glacier.jpg", "lagoon.png", "red-ridge.jpg", "violet-hour.png", "mist.jpg",
      ];
      const images = {};
      photos.forEach((file, i) => (images[101 + i] = `assets/photos/${file}`));

      await mount({
        wasm: "./album.wasm",
        root: document.getElementById("app"),
        images,
        icons: { 121: "assets/icons/heart.svg", 122: "assets/icons/search.svg" },
        fonts: { 11: "Geist, system-ui, sans-serif", 12: "'Geist Mono', monospace" },
      });
    </script>
  </body>
</html>
