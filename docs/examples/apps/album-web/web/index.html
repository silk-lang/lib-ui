<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Album</title>
    <style>
      /* The two fonts the album ships. Geist is a variable font: one file, weights 100 to 900. */
      @font-face {
        font-family: "Geist";
        src: url("fonts/Geist.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("fonts/GeistMono.ttf") format("truetype");
        font-weight: 100 900;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "./silk-ui-dom.js";

      // The album names its photos and icons by URL ("photos/dusk.png"), so the page loads them
      // from beside itself. Fonts are still numbers: DISPLAY and LABEL.
      await mount({
        wasm: "./album.wasm",
        root: document.getElementById("app"),
        fonts: { 11: "Geist, system-ui, sans-serif", 12: "'Geist Mono', monospace" },
      });
    </script>
  </body>
</html>
