<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silk UI example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* A finger that drags up or down over the example scrolls the page around it. */
      #app canvas {
        touch-action: pan-y !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      One of the docs' window examples, running on a WebGPU canvas that fills this page:
      live/?app=hello. The docs pages put this page in a frame where they would otherwise show
      a picture of the example, and take the frame away again if the example cannot start.
    -->
    <script type="module">
      import { runApp, unsupported } from "./app-host.js";

      // The numbers `docs/live/src/main.silk` knows the examples by.
      const APPS = { hello: 0, pad: 1, swatches: 2, tree: 3, card: 4, clicker: 5, field: 6, remote: 7 };
      const name = new URLSearchParams(location.search).get("app") ?? "hello";
      const tell = (state, detail) => parent.postMessage({ silkLive: state, app: name, detail }, "*");
      const problem = name in APPS ? unsupported() : `There is no example called ${name}.`;
      // The examples here do not scroll, so the wheel is left to the page around the frame.
      window.addEventListener("wheel", (event) => event.stopImmediatePropagation(), { capture: true });
      if (problem) {
        tell("failed", problem);
      } else {
        runApp({
          wasm: "./app.wasm",
          container: document.getElementById("app"),
          // Nothing an example keeps should outlive the page.
          storage: null,
          // The reader may be typing elsewhere in the page: the example waits for a click.
          focus: false,
          imports: { docs: { app: () => APPS[name] } },
        })
          // An example that could not start says so and returns: there is no adapter, say.
          .then((status) => tell(status === 0 ? "closed" : "failed", status))
          .catch((error) => {
            console.error(error);
            tell("failed", String(error?.message ?? error));
          });
      }
    </script>
  </body>
</html>
