<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silk UI example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font: 13px/1.2 system-ui, sans-serif;
        color: #1f2937;
      }
      /* The first window fills the page. Windows the example opens later go under it, each
         with a title bar, and the page asks the frame it is in to grow by their height. */
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      #app canvas:first-of-type {
        flex: 1 1 0;
        height: auto !important;
        min-height: 0 !important;
        min-width: 0 !important;
      }
      #app canvas ~ canvas {
        flex: none;
        margin: 0 12px 12px;
        max-width: calc(100% - 26px);
        border: 1px solid #d1d5db;
        border-top: 0;
        border-radius: 0 0 10px 10px;
      }
      /* A finger that drags up or down over the example scrolls the page around it. */
      #app canvas {
        touch-action: pan-y !important;
      }
      /* What a desktop puts around a window: its title and a button that asks it to close. */
      .bar {
        flex: none;
        box-sizing: border-box;
        height: 30px;
        display: flex;
        align-items: center;
        padding: 0 6px 0 12px;
        background: #f3f4f6;
        border-bottom: 1px solid #d1d5db;
        user-select: none;
      }
      .bar span {
        flex: 1;
        font-weight: 600;
      }
      .bar button {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: #6b7280;
        font: inherit;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      .bar button:hover {
        background: #e5e7eb;
        color: #1f2937;
      }
      .bar.extra {
        margin: 12px 12px 0;
        max-width: calc(100% - 24px);
        border: 1px solid #d1d5db;
        border-radius: 10px 10px 0 0;
      }
      /* Over an example whose window has closed. */
      #closed {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f9fafb;
        color: #6b7280;
      }
      #closed[hidden] {
        display: none;
      }
      #closed button {
        padding: 6px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
        color: #1f2937;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="closed" hidden>
      <span>The window closed.</span>
      <button type="button" onclick="location.reload()">Open it again</button>
    </div>
    <!--
      One of the docs' window examples, running on a WebGPU canvas that fills this page:
      live/?app=hello. The docs pages put this page in a frame where they would otherwise show
      a picture of the example, and take the frame away again if the example cannot start.
    -->
    <script type="module">
      import { runApp, unsupported } from "./app-host.js";

      // The numbers `docs/live/src/main.silk` knows the examples by.
      const APPS = { hello: 0, pad: 1, swatches: 2, tree: 3, card: 4, clicker: 5, field: 6, remote: 7, board: 8, album: 9 };
      const name = new URLSearchParams(location.search).get("app") ?? "hello";
      const tell = (state, detail) => parent.postMessage({ silkLive: state, app: name, detail }, "*");
      const problem = name in APPS ? unsupported() : `There is no example called ${name}.`;
      // The examples here do not scroll, so the wheel is left to the page around the frame.
      window.addEventListener("wheel", (event) => event.stopImmediatePropagation(), { capture: true });
      // The examples whose first window gets a title bar, because the page talks about closing
      // it, and what the bars of the windows an example opens later say.
      const TITLED = { pad: "Pad" };
      const LATER = { swatches: "Preview" };
      const app = document.getElementById("app");
      let control;
      const bar = (title, id) => {
        const element = document.createElement("div");
        element.className = "bar";
        const label = document.createElement("span");
        label.textContent = title;
        const close = document.createElement("button");
        close.type = "button";
        close.textContent = "\u00d7";
        close.title = "Close";
        close.setAttribute("aria-label", `Close ${title}`);
        close.addEventListener("click", () => control?.close(id));
        element.append(label, close);
        return element;
      };
      if (name in TITLED) app.append(bar(TITLED[name], 1));
      // A window opened later is a canvas the window host adds. It gets a bar above it, and
      // the frame around this page is told how much taller the windows under the first are.
      let base = 0;
      const later = () => {
        let height = 0;
        const [first, ...others] = app.querySelectorAll("canvas");
        if (!first) return;
        // The first window keeps the height it had before the others came.
        if (others.length === 0) first.style.flex = "";
        else if (!first.style.flex) first.style.flex = `0 0 ${base}px`;
        if (others.length === 0) base = first.offsetHeight;
        for (const element of [...app.querySelectorAll(".bar.extra")]) {
          if (!document.getElementById(element.dataset.window)) element.remove();
        }
        for (const canvas of others) {
          if (!app.querySelector(`.bar.extra[data-window="${canvas.id}"]`)) {
            const id = Number(canvas.id.replace("silk-window-", ""));
            const element = bar(LATER[name] ?? "Window", id);
            element.classList.add("extra");
            element.dataset.window = canvas.id;
            element.style.width = `calc(${canvas.style.width} + 2px)`;
            canvas.before(element);
          }
          height += canvas.offsetHeight + 30 + 12 + 12;
        }
        tell("extra", height);
      };
      new MutationObserver(later).observe(app, { childList: true });
      new ResizeObserver(() => {
        const canvases = app.querySelectorAll("canvas");
        if (canvases.length === 1) base = canvases[0].offsetHeight;
      }).observe(app);
      if (problem) {
        tell("failed", problem);
      } else {
        runApp({
          wasm: "./app.wasm",
          container: app,
          windows: (given) => (control = given),
          // Nothing an example keeps should outlive the page.
          storage: null,
          // The reader may be typing elsewhere in the page: the example waits for a click.
          focus: false,
          imports: { docs: { app: () => APPS[name] } },
        })
          // An example that could not start says so and returns: there is no adapter, say.
          .then((status) => {
            if (status === 0) document.getElementById("closed").hidden = false;
            tell(status === 0 ? "closed" : "failed", status);
          })
          .catch((error) => {
            console.error(error);
            tell("failed", String(error?.message ?? error));
          });
      }
    </script>
  </body>
</html>
