<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%TITLE% · Silk UI</title>
    <meta
      name="description"
      content="Silk UI: a retained UI tree, an Elm-style framework for browser and native apps, and everything for building native apps with them, in Silk."
    />
    <link rel="icon" href="%BASE%/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="%BASE%/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE%/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter Tight";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("%BASE%/fonts/inter-tight-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter Tight";
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url("%BASE%/fonts/inter-tight-latin-wght-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("%BASE%/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: italic;
        font-weight: 100 800;
        font-display: swap;
        src: url("%BASE%/fonts/jetbrains-mono-latin-wght-italic.woff2") format("woff2");
      }

      /* The colors the program names (docs/src/theme.silk). Light first, then dark: by the
         system's scheme, unless the reader chose one with the Theme button. */
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --paper-veil: rgb(255 255 255 / 0.86);
        --panel: #f6f6f4;
        --ink: #0b0b0c;
        --body: #2f2f34;
        --muted: #66666c;
        --faint: #8d8d93;
        --rule: #e6e6e2;
        --signal: #109c90;
        --signal-ink: #0b756c;
        --signal-line: rgb(16 156 144 / 0.4);
        --signal-soft: #e4f4f1;
        --on-signal: #ffffff;
        --code-surface: #f7f7f5;
        --code-plain: #1d1d20;
        --code-keyword: #0b756c;
        --code-type: #1d1d20;
        --code-string: #9a4a12;
        --code-comment: #8a8a90;
        --code-number: #9a4a12;
        --code-call: #3b4a9a;
        --window: #ffffff;
        --window-ink: #1f2937;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #0e0e10;
        --paper-veil: rgb(14 14 16 / 0.84);
        --panel: #17171a;
        --ink: #f4f4f5;
        --body: #cfcfd4;
        --muted: #9a9aa1;
        --faint: #75757c;
        --rule: #26262b;
        --signal: #2cc4b4;
        --signal-ink: #5fdccd;
        --signal-line: rgb(95 220 205 / 0.4);
        --signal-soft: #10302d;
        --on-signal: #06211e;
        --code-surface: #131316;
        --code-plain: #e2e2e6;
        --code-keyword: #5fdccd;
        --code-type: #e2e2e6;
        --code-string: #f0b27a;
        --code-comment: #74747b;
        --code-number: #f0b27a;
        --code-call: #a5b4fc;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --paper: #0e0e10;
          --paper-veil: rgb(14 14 16 / 0.84);
          --panel: #17171a;
          --ink: #f4f4f5;
          --body: #cfcfd4;
          --muted: #9a9aa1;
          --faint: #75757c;
          --rule: #26262b;
          --signal: #2cc4b4;
          --signal-ink: #5fdccd;
          --signal-line: rgb(95 220 205 / 0.4);
          --signal-soft: #10302d;
          --on-signal: #06211e;
          --code-surface: #131316;
          --code-plain: #e2e2e6;
          --code-keyword: #5fdccd;
          --code-type: #e2e2e6;
          --code-string: #f0b27a;
          --code-comment: #74747b;
          --code-number: #f0b27a;
          --code-call: #a5b4fc;
        }
      }
      html {
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        scroll-padding-top: 84px;
      }
      body {
        margin: 0;
      }
      /* A picture whose example is running in a frame next to it (see the script below). */
      img[data-live-on] {
        display: none !important;
      }
      iframe[data-live] {
        display: block;
        max-width: 100%;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: #ffffff;
      }
    </style>
    <script>
      // Before the first paint, so a chosen theme never flashes the other one.
      try {
        const theme = localStorage.getItem("silk-ui-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"><!--silk-ui--></div>
    <script type="module">
      import { mount } from "%BASE%/silk-ui-dom.js";

      const root = document.documentElement;
      const decoder = new TextDecoder();
      let page;
      const text = (pointer, length) =>
        page ? decoder.decode(new Uint8Array(page.exports.memory.buffer, pointer, length)) : "";

      // A section of the page, by the address its heading has (`#the-model`).
      const section = () => {
        const name = decodeURIComponent(location.hash.slice(1));
        if (!name) return;
        document.querySelector(`[data-testid="${CSS.escape(name)}"]`)?.scrollIntoView({ block: "start" });
      };
      window.addEventListener("hashchange", section);

      window.page = page = await mount({
        wasm: "%BASE%/site.wasm",
        root: document.getElementById("app"),
        base: "%BASE%",
        images: %IMAGES%,
        fonts: {
          1: '"Inter Tight", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif',
          2: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace',
        },
        // The `Browser` service of the program, as `src/main.silk` imports it.
        imports: {
          site: {
            setTitle: (pointer, length) => {
              const title = text(pointer, length);
              if (title) document.title = title === "Silk UI" ? title : `${title} · Silk UI`;
            },
            copy: (pointer, length) => navigator.clipboard?.writeText(text(pointer, length)),
            random: () => Math.random(),
            minutes: () => {
              const now = new Date();
              return now.getHours() * 60 + now.getMinutes();
            },
            toggleTheme: () => {
              const dark = root.dataset.theme
                ? root.dataset.theme === "dark"
                : matchMedia("(prefers-color-scheme: dark)").matches;
              root.dataset.theme = dark ? "light" : "dark";
              try {
                localStorage.setItem("silk-ui-theme", root.dataset.theme);
              } catch {}
            },
            scrollToTop: () => (location.hash ? section() : window.scrollTo(0, 0)),
          },
        },
      });
      section();

      // Where the browser can run them, the window examples replace their pictures: `live/` is
      // the example on a WebGPU canvas, and it goes in a frame next to the picture when the
      // picture comes into view. The program owns the page's nodes and may reuse a picture's
      // node for another picture, so every change to the page is checked against the frames.
      const LIVE = {
        "native-hello": "hello",
        "native-pad": "pad",
        "native-swatches": "swatches",
        "tree-window": "tree",
        "tree-card": "card",
        "tree-card-hover": "card",
        "tree-clicker": "clicker",
        "tree-field": "field",
        "tree-remote": "remote",
        "native-board": "board",
      };
      let able =
        !!navigator.gpu &&
        typeof WebAssembly.Suspending === "function" &&
        typeof WebAssembly.promising === "function";
      let adapter;
      const pictured = (image) => /\/shots\/([\w-]+)\.png$/.exec(image.getAttribute("src") ?? "")?.[1];
      const restore = (image) => {
        delete image.dataset.live;
        delete image.dataset.liveOn;
      };
      const run = (image) => {
        const name = image.dataset.live;
        if (!able || !name || image.dataset.liveOn !== undefined || !image.naturalWidth) return;
        const frame = document.createElement("iframe");
        frame.dataset.live = name;
        frame.title = image.alt || "A running example";
        frame.src = `%BASE%/live/?app=${LIVE[name]}`;
        frame.style.width = image.style.width;
        frame.style.aspectRatio = `${image.naturalWidth} / ${image.naturalHeight}`;
        image.after(frame);
        image.dataset.liveOn = "";
      };
      const near = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            near.unobserve(entry.target);
            if (entry.target.complete) run(entry.target);
            else entry.target.addEventListener("load", () => run(entry.target), { once: true });
          }
        },
        { rootMargin: "300px" },
      );
      const sync = () => {
        for (const frame of document.querySelectorAll("iframe[data-live]")) {
          const image = frame.previousElementSibling;
          if (able && image?.dataset.live === frame.dataset.live && pictured(image) === frame.dataset.live) continue;
          frame.remove();
        }
        for (const image of document.querySelectorAll("img[data-live]")) {
          const frame = image.nextElementSibling;
          if (!able || pictured(image) !== image.dataset.live || (image.dataset.liveOn !== undefined && frame?.dataset.live !== image.dataset.live)) {
            near.unobserve(image);
            restore(image);
          }
        }
        if (!able) return;
        for (const image of document.querySelectorAll('img[src*="/shots/"]:not([data-live])')) {
          const name = pictured(image);
          if (!(name in LIVE)) continue;
          // A browser can have WebGPU and still no adapter to give: ask, once, before the
          // first picture is taken away.
          if (adapter === undefined) {
            adapter = false;
            navigator.gpu
              .requestAdapter()
              .catch(() => null)
              .then((found) => {
                able = adapter = !!found;
                sync();
              });
          }
          if (!adapter) return;
          image.dataset.live = name;
          near.observe(image);
        }
      };
      if (able) {
        // An example that could not start (no GPU adapter, say) gives the pictures back.
        window.addEventListener("message", (event) => {
          if (event.data?.silkLive !== "failed") return;
          able = false;
          sync();
        });
        new MutationObserver(sync).observe(document.getElementById("app"), {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src"],
        });
        sync();
      }
    </script>
  </body>
</html>
