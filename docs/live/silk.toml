[package]
name = "ui-docs-live"
description = "The native and tree examples of the docs, built for a WebGPU canvas in the page"
version = "0.1.0"
silk-version = "0.1.0-dev.69+366225ca4dc5"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { path = "../examples/window", package = "ui-docs-window-client" }
ui_app = { path = "../../modules/app", package = "ui-app" }
ui_app_window = { path = "../../modules/app/window", package = "ui-app-window" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "66c80a2e4afdf43787d9ec63a474d793e3da1194", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
ui_inspect_server = { path = "../../modules/inspect/server", package = "ui-inspect-server" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "31b30b3ea10ef42091b19cc62dafd4078a7ab6aa", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "31b30b3ea10ef42091b19cc62dafd4078a7ab6aa", path = "modules/vector", package = "graphics-vector" }
