[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
ui_app = { path = "../../modules/app", package = "ui-app" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "c411ca0dc6a2b2ee0ba152f42578705ba2105773", path = "modules/collection", package = "font-collection" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/codec", package = "graphics-codec" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "c6be578f9e005814cd779bf3723f8611d440094e", path = "modules/vector", package = "graphics-vector" }
