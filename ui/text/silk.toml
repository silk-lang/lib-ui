[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
silk-version = "0.1.0-dev.61+91f335268900"
kind = "library"
exports = ["lib", "fonts", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "6f275d3188f282156711495dc0ad4126f8b1990b", path = "css/layout", package = "css-layout" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/collection", package = "font-collection" }
harfrust = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/shape", package = "font-shape" }
read_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/parse", package = "font-parse" }
font_types = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/types", package = "font-types" }
raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/raster", package = "font-raster" }
