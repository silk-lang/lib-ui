[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
silk-version = "0.1.0-dev.61+91f335268900"
kind = "library"
exports = ["lib", "mutation", "style", "resources", "provider", "node", "paint", "tree", "inspect", "batch", "grid", "canvas_text", "input", "interact", "scrollbar", "edit", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "6f275d3188f282156711495dc0ad4126f8b1990b", path = "css/layout", package = "css-layout" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/collection", package = "font-collection" }
font_raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/raster", package = "font-raster" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "89b0d4c417d5171c9780d913768edd82e5a17544", path = "graphics/atlas", package = "graphics-atlas" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "89b0d4c417d5171c9780d913768edd82e5a17544", path = "graphics/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "89b0d4c417d5171c9780d913768edd82e5a17544", path = "graphics/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "89b0d4c417d5171c9780d913768edd82e5a17544", path = "graphics/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "b53d0cec915bedfc34f359017b6fdbac4246cfe5", path = "svg/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "b53d0cec915bedfc34f359017b6fdbac4246cfe5", path = "svg", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "6f275d3188f282156711495dc0ad4126f8b1990b", path = "css/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "6ed6967f4b8d7b1738d8d0947fae59d5f3add627", path = "fonts/faces", package = "font-faces" }
