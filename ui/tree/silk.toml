[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "mutation", "style", "resources", "provider", "node", "paint", "tree", "inspect", "batch", "grid", "canvas_text", "input", "interact", "scrollbar", "edit", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view"]

[dependencies]
layout = { git = "https://github.com/silk-lang/lib-css.git", rev = "15f9d5f0e6efce81fd896a193cd45c3fdafa191b", path = "css/layout", package = "css-layout" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/collection", package = "font-collection" }
font_raster = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/raster", package = "font-raster" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/atlas", package = "graphics-atlas" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/vector", package = "graphics-vector" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "3982939cf483e1f643fb3a228e97253d8c5a5b73", path = "svg/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "3982939cf483e1f643fb3a228e97253d8c5a5b73", path = "svg", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "15f9d5f0e6efce81fd896a193cd45c3fdafa191b", path = "css/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/faces", package = "font-faces" }
