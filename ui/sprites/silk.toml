[package]
name = "ui-sprites"
description = "SVG icons and decoded images as atlas tiles for the UI renderer"
version = "0.1.0"
silk-version = "0.1.0-dev.63+657e3c900f65"
kind = "library"
exports = ["lib", "uploads", "icons", "images"]

[dependencies]
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/atlas", package = "graphics-atlas" }
codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "b1093a18d6333137c9ede3feef8f548790396fdd", path = "graphics/codec", package = "graphics-codec" }
svg_render = { git = "https://github.com/silk-lang/lib-svg.git", rev = "3982939cf483e1f643fb3a228e97253d8c5a5b73", path = "svg/render", package = "svg-render" }
svg_core = { git = "https://github.com/silk-lang/lib-svg.git", rev = "3982939cf483e1f643fb3a228e97253d8c5a5b73", path = "svg", package = "svg" }
svg_css = { git = "https://github.com/silk-lang/lib-css.git", rev = "15f9d5f0e6efce81fd896a193cd45c3fdafa191b", path = "css/style", package = "css-style" }
svg_fonts = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ec44d02117695fe4ec3e11f8c6cd360fabe01261", path = "fonts/faces", package = "font-faces" }
