name: Bootstrap pinned Silk
description: Install the official Silk launcher and the workspace-pinned compiler
runs:
  using: composite
  steps:
    # Tasks are compiled programs; Clang must exist before the first task runs.
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        test -x /usr/bin/clang-22 || sudo apt-get install -y clang-22 lld-22
        echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        test -x /opt/homebrew/opt/llvm@22/bin/clang || brew install llvm@22
        test -x /opt/homebrew/opt/lld@22/bin/ld64.lld || brew install lld@22
        echo "SILK_CLANG=/opt/homebrew/opt/llvm@22/bin/clang" >> "$GITHUB_ENV"
        echo "/opt/homebrew/opt/lld@22/bin" >> "$GITHUB_PATH"
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lock = Get-Content toolchains.lock.json -Raw | ConvertFrom-Json
        $asset = $lock.llvm.platforms.'x86_64-pc-windows-msvc'
        $archive = "$env:RUNNER_TEMP/llvm-22.tar.xz"
        Invoke-WebRequest $asset.url -OutFile $archive
        if ((Get-Item $archive).Length -ne $asset.bytes -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'LLVM archive verification failed' }
        $destination = "$env:RUNNER_TEMP/llvm-22"
        New-Item -ItemType Directory -Force $destination | Out-Null
        tar -xf $archive -C $destination
        if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed' }
        $compilers = @(Get-ChildItem $destination -Recurse -Filter clang.exe | Where-Object { $_.Directory.Name -eq 'bin' })
        if ($compilers.Count -ne 1) { throw 'Expected exactly one LLVM clang.exe' }
        "SILK_CLANG=$($compilers[0].FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $compilers[0].DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
    - if: runner.os != 'Windows'
      shell: bash
      env:
        SILK_RELEASE: v0.1.0-dev.74+205aea3f5b2e
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh --output "$RUNNER_TEMP/install-silk.sh"
        sh "$RUNNER_TEMP/install-silk.sh"
        echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        SILK_RELEASE: v0.1.0-dev.74+205aea3f5b2e
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        Invoke-WebRequest https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.ps1 -OutFile "$env:RUNNER_TEMP/install-silk.ps1"
        & "$env:RUNNER_TEMP/install-silk.ps1"
        "$env:USERPROFILE/.silk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - shell: bash
      run: silk use
