name: UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux window headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Bootstrap pinned Silk
        run: node scripts/install-silk.mjs
      - name: Provision pinned LLVM and native tools
        run: node scripts/setup-ci.mjs
      - name: Every package, tests, HTTP images, goldens and wasm API checks
        run: node scripts/check.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-package-failures-${{ runner.os }}
          path: |
            build/test-results
            modules/**/actual*
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux window hosts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth weston
      - run: node scripts/install-silk.mjs
      - if: runner.os == 'Linux'
        run: node scripts/setup-ci.mjs --linux-gpu
      - if: runner.os != 'Linux'
        run: node scripts/setup-ci.mjs
      - name: Native rendering, input, inspector, MCP and devtools
        run: node scripts/check-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-inspector-${{ runner.os }}
          path: .cache/ui-inspect/*.png
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth
      - run: node scripts/install-silk.mjs
      - name: Pinned Playwright and existing Chromium
        run: node scripts/setup-ci.mjs --browser
      - name: Chrome text, GPU fixtures and real browser input
        run: node scripts/check-browser.mjs
