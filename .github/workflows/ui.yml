name: UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux window headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Every package, tests, HTTP images, goldens and wasm API checks
        if: runner.os != 'Windows'
        run: silk task check
      # Managed HTTP/native fixtures require silk-lang/silk#3034 on Windows.
      - name: Windows package checks
        if: runner.os == 'Windows'
        run: silk task check-packages
      - name: Windows unit tests
        if: runner.os == 'Windows'
        run: silk task unit-tests
      - name: Windows goldens
        if: runner.os == 'Windows'
        run: silk task goldens
      - name: Windows tools
        if: runner.os == 'Windows'
        run: silk task build-tools
      - name: Windows embedded asset freshness
        if: runner.os == 'Windows'
        run: silk task embed-assets --check
      - name: Windows browser export freshness
        if: runner.os == 'Windows'
        run: silk task generate-browser-exports --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-package-failures-${{ runner.os }}
          path: |
            build/test-results
            modules/**/actual*
  native:
    strategy:
      fail-fast: false
      matrix:
        # Windows managed integration is blocked by silk-lang/silk#3034.
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window hosts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth weston
      - uses: ./.github/actions/setup-silk
      - if: runner.os == 'Linux'
        run: silk task setup-ci --linux-gpu
      - if: runner.os != 'Linux'
        run: silk task setup-ci
      - name: Native rendering, input, inspector, MCP and devtools
        run: silk task native check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-inspector-${{ runner.os }}
          path: .cache/ui-inspect/*.png
          if-no-files-found: ignore
  ghostty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux window headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      # Linux and the browser build libghostty-vt from source; macOS and Windows download it.
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.17.1
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: Prepare libghostty-vt
        if: runner.os != 'Linux'
        run: python3 modules/ghostty/vt/scripts/prepare
      - name: Prepare libghostty-vt, native and WebAssembly
        if: runner.os == 'Linux'
        run: python3 modules/ghostty/vt/scripts/prepare --wasm
      - name: Wrapper tests
        run: silk test --manifest-path modules/ghostty/vt/silk.toml --root src/tests.silk
      - name: Component tests
        run: silk test --manifest-path modules/ghostty/tests/silk.toml --root src/tests.silk
      - name: Demo PTY tests
        if: runner.os != 'Windows'
        run: silk test --manifest-path modules/ghostty/demo/silk.toml --root src/tests.silk
      - name: Demo app builds
        run: silk build --manifest-path modules/ghostty/demo/silk.toml
      - name: Browser page tests and build
        if: runner.os == 'Linux'
        run: |
          silk test --manifest-path modules/ghostty/web/silk.toml --root src/tests.silk
          sh modules/ghostty/web/build.sh
  javascript:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-silk
      - name: Provision pinned LLVM and native tools
        run: silk task setup-ci
      - name: JavaScript package tests and example bundles
        working-directory: modules/js
        run: npm ci && npm test && npm run build
      - name: Bundled examples on the embedded engine
        run: silk test --manifest-path modules/js/examples/tests/silk.toml --root src/tests.silk
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth
      - uses: ./.github/actions/setup-silk
      - name: Select existing Chromium
        run: silk task setup-ci --browser
      # Ubuntu's AppArmor profile denies unprivileged user namespaces, which Chromium's sandbox
      # needs. Without this Chromium aborts at startup with "No usable sandbox".
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The first Chromium start on a fresh runner reads the browser and its fonts from a cold disk,
      # which has taken over 30 seconds. Pay for it here, timed, rather than inside a CDP request.
      - name: Warm up Chromium
        run: time timeout 300 "$CHROMIUM_EXECUTABLE" --headless=new --password-store=basic --user-data-dir="$(mktemp -d)" --dump-dom about:blank > /dev/null
      - name: Chrome text, GPU fixtures and real browser input
        run: silk task browser check
